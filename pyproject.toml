[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dcs-yolox-pipeline"
version = "0.1.0"
description = "DCS synthetic dataset → YOLOX training/evaluation/export pipeline"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
]
dataset = [
    "numpy>=1.21",
    "opencv-python-headless>=4.5",
    "pycocotools>=2.0.2",
    "pillow>=8.0",
    "matplotlib>=3.8",   # confusion-matrix heatmap + eval visualizations (also baked into GPU images)
]
training = [
    "torch>=2.0",
    "torchvision>=0.15",
    "mlflow>=2.0",
]
agent = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "requests>=2.28",
]
tui = [
    "rich>=13.0",
    "textual>=0.50",   # Control Room live TUI (apps/pipeline/control_room.py)
]
# Host-side DCS World capture (apps/dcs_capture_host). Installed on the Windows
# host, NOT in Docker — see docs/dcs_capture.md and requirements-dcs-capture.txt.
dcs-capture = [
    "numpy>=1.21",
    "pyyaml>=6.0",
    "opencv-python>=4.5",
    "pydcs",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*", "experiments*", "scripts*"]
exclude = ["tests*", "storage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["vendor", "docs"]

[tool.ruff.lint]
select = ["F", "I"]   # pyflakes (real bugs / unused) + import sorting

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # re-exports are intentional
